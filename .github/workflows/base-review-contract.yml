name: Base Review Contract

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  base_review_contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build CLI
        run: make build

      - name: Verify base review report contract
        run: |
          set -euo pipefail
          output="$(bin/codex-reviewer review local --dry-run --base origin/main)"
          printf '%s\n' "$output"
          grep -F "codex-review/branch-review.md" <<<"$output"
          grep -F "Review this branch against origin/main" <<<"$output"
          grep -F "Diff summary" <<<"$output"
          grep -F "Areas checked" <<<"$output"
          grep -F "Areas not checked / limits" <<<"$output"
          grep -F "Tests to run" <<<"$output"
