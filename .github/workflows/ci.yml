name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_lint_test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: golangci/golangci-lint-action@v6
        with:
          version: v2.12.2
          args: --timeout=5m

      - name: Build
        run: make build

      - name: Lint
        run: make lint

      - name: Test with coverage gate
        run: make coverage-check COVERAGE_THRESHOLD=75.0
