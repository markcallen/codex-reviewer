name: Smoke

on:
  workflow_dispatch:
  workflow_call:

jobs:
  local_smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Smoke test local CLI
        run: make smoke-local

  docker_smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Smoke test packaged CLI
        run: make smoke-docker

  k8s_smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install kind and kubectl
        run: |
          mkdir -p bin
          GOBIN="$PWD/bin" go install sigs.k8s.io/kind@v0.30.0
          curl -fsSL "https://dl.k8s.io/release/$(curl -fsSL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl" -o bin/kubectl
          chmod +x bin/kubectl
          echo "$PWD/bin" >> "$GITHUB_PATH"

      - name: Smoke test Kubernetes job
        run: make smoke-k8s
