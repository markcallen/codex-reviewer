name: Publish CLI

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: Semantic version bump
        required: true
        type: choice
        options: [patch, minor, major]
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release_tag:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Validate
        run: |
          make build
          make lint
          make coverage-check COVERAGE_THRESHOLD=75.0

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dispatch_release:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: previous_tag
        uses: WyriHaximus/github-action-get-previous-tag@v2
        with:
          fallback: v0.0.0

      - id: semvers
        uses: WyriHaximus/github-action-next-semvers@v1
        with:
          version: ${{ steps.previous_tag.outputs.tag }}

      - id: next
        run: |
          case "${{ inputs.release_type }}" in
            patch) version="${{ steps.semvers.outputs.patch }}" ;;
            minor) version="${{ steps.semvers.outputs.minor }}" ;;
            major) version="${{ steps.semvers.outputs.major }}" ;;
            *) echo "unsupported release_type=${{ inputs.release_type }}" >&2; exit 1 ;;
          esac
          echo "tag=v${version#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Validate
        run: |
          make build
          make lint
          make coverage-check COVERAGE_THRESHOLD=75.0

      - name: Create release tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.next.outputs.tag }}"
          git push origin "${{ steps.next.outputs.tag }}"
