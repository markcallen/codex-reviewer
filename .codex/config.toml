# Project-scoped Codex configuration for a review-first workflow.
# Put this file at <repo>/.codex/config.toml for a shared repo setup,
# or merge the settings into ~/.codex/config.toml for personal use.

# Strong default for local Codex sessions.
model = "gpt-5.5"
model_reasoning_effort = "medium"
model_verbosity = "medium"

# Makes the built-in /review command use the same high-capability model.
review_model = "gpt-5.5"

# Safer defaults for normal Codex work. The custom reviewer subagent below
# overrides its own sandbox to read-only.
approval_policy = "on-request"
sandbox_mode = "workspace-write"
web_search = "cached"

[agents]
# Keep this low enough to prevent accidental fan-out, but high enough for
# one reviewer plus optional security/test/docs specialists later.
max_threads = 4
max_depth = 1

[codex_reviewer]
# Local is the default. Set backend = "k8s" and k8s_api_url when using the
# Kubernetes-backed review API.
backend = "local"
report = "codex-review/full-review.md"
k8s_api_url = ""
