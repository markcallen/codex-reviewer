version: 2

project_name: codex-reviewer

before:
  hooks:
    - go mod tidy

builds:
  - id: codex-reviewer
    main: ./cmd/codex-reviewer
    binary: codex-reviewer
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - id: codex-reviewer
    builds:
      - codex-reviewer
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}

checksum:
  name_template: checksums.txt

snapshot:
  version_template: '{{ incpatch .Version }}-next'

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'

release:
  github:
    owner: markcallen
    name: codex-reviewer
