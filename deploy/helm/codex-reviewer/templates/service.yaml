apiVersion: v1
kind: Service
metadata:
  name: {{ include "codex-reviewer.fullname" . }}
  labels:
    {{- include "codex-reviewer.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "codex-reviewer.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
