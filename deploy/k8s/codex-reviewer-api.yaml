apiVersion: v1
kind: ServiceAccount
metadata:
  name: codex-reviewer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: codex-reviewer-api
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete", "patch", "update"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: codex-reviewer-api
subjects:
  - kind: ServiceAccount
    name: codex-reviewer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: codex-reviewer-api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: codex-reviewer-api
  labels:
    app.kubernetes.io/name: codex-reviewer
    app.kubernetes.io/component: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: codex-reviewer
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: codex-reviewer
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: codex-reviewer
      containers:
        - name: api
          image: codex-reviewer:phase1
          imagePullPolicy: IfNotPresent
          args:
            - codex-reviewer
            - service
            - api
            - --listen=:8080
            - --namespace=$(POD_NAMESPACE)
            - --reviewer-image=codex-reviewer:phase1
            - --sidecar-image=openai-egress:phase1
            - --service-account=codex-reviewer
            - --openai-secret=openai-api
            - --github-secret=github-token
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
---
apiVersion: v1
kind: Service
metadata:
  name: codex-reviewer-api
  labels:
    app.kubernetes.io/name: codex-reviewer
    app.kubernetes.io/component: api
spec:
  selector:
    app.kubernetes.io/name: codex-reviewer
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 8080
      targetPort: http
